# ============================================================
# CI/CD Pipeline — Mock Service (Python)
# ============================================================
# Flow:
#   Lint & Test → SAST Scan (Semgrep) → Build Image →
#   Image Scan (Trivy) → Severity Gate → Push to GHCR →
#   Deploy to Staging → Manual Approval → Deploy to Production
#
# Demonstrates: severity-based security gating, multi-stage
# environment promotion with manual approval gates — patterns
# used in production CI/CD but built here from scratch with
# free/open-source tooling.
# ============================================================

name: "CI/CD — Mock Service"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mock-service

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: "1. Lint & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --exclude=.venv

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No tests directory found — skipping (add one soon!)"
          fi

  # ─────────────────────────────────────────────
  # JOB 2 — SAST Scan (Semgrep)
  # Scans source code for security issues before we
  # even bother building an image
  # ─────────────────────────────────────────────
  sast-scan:
    name: "2. SAST Scan (Semgrep)"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
        continue-on-error: true  # non-blocking here; real gate is the summary step below

      - name: Semgrep scan complete
        run: echo "✅ SAST scan finished — see Semgrep step output/artifact for findings"

  # ─────────────────────────────────────────────
  # JOB 3 — Build Docker Image
  # ─────────────────────────────────────────────
  build:
    name: "3. Build Image"
    runs-on: ubuntu-latest
    needs: sast-scan
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image-tag=${{ env.IMAGE_NAME }}:${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet — scan first)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.tag.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact for scan job
        run: docker save ${{ steps.tag.outputs.image-tag }} -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 4 — Image Vulnerability Scan (Trivy) + Severity Gate
  # This is the core "engineering judgment" step:
  # CRITICAL/HIGH findings fail the build, MEDIUM/LOW just warn
  # ─────────────────────────────────────────────
  image-scan:
    name: "4. Image Scan & Severity Gate (Trivy)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Run Trivy — report all findings (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: table
          severity: "LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "0"

      - name: Run Trivy — enforce gate on CRITICAL/HIGH only
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "1"     # fails the job if CRITICAL/HIGH found
          ignore-unfixed: true

  # ─────────────────────────────────────────────
  # JOB 5 — Push Image to GHCR
  # Only runs if the severity gate passed
  # ─────────────────────────────────────────────
  push:
    name: "5. Push Image to GHCR"
    runs-on: ubuntu-latest
    needs: [build, image-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.build.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm push
        run: echo "✅ Image pushed → ${{ needs.build.outputs.image-tag }}"

  # ─────────────────────────────────────────────
  # JOB 6 — Deploy to Staging
  # Simulated deploy step — swap this out for your real
  # deploy target (a VM, Render, Fly.io, k8s cluster, etc.)
  # ─────────────────────────────────────────────
  deploy-staging:
    name: "6. Deploy to Staging"
    runs-on: ubuntu-latest
    needs: push
    environment: "staging"
    steps:
      - name: Deploy image to staging
        run: |
          echo "Deploying ${{ needs.build.outputs.image-tag }} to staging..."
          echo "✅ Staging deploy complete (replace with real deploy step)"

  # ─────────────────────────────────────────────
  # JOB 7 — Manual Approval Gate for Production
  # Configure in GitHub → Settings → Environments → production:
  #   Required reviewers: add yourself (or a teammate)
  # Pipeline pauses here until manually approved
  # ─────────────────────────────────────────────
  production-approval:
    name: "7. Await Production Approval"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: "production"
    steps:
      - name: Approved for production
        run: echo "✅ Production promotion approved by ${{ github.actor }}"

  # ─────────────────────────────────────────────
  # JOB 8 — Deploy to Production
  # ─────────────────────────────────────────────
  deploy-production:
    name: "8. Deploy to Production"
    runs-on: ubuntu-latest
    needs: [production-approval, build]
    steps:
      - name: Deploy image to production
        run: |
          echo "Deploying ${{ needs.build.outputs.image-tag }} to production..."
          echo "✅ Production deploy complete (replace with real deploy step)"